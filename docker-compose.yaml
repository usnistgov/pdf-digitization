services:
  parsepd:
    build:
      context: .
      dockerfile: Dockerfile
      # VITE_API_URL is the only frontend env var read at runtime.
      # Default "/" makes the SPA call /chat/completions on the same origin,
      # which nginx proxies to the backend.
      args:
        VITE_API_URL: /
    ports:
      - "8080:8080"
    # Backend secrets — set values in a .env file at repo root, never hardcode here
    env_file: .env
    restart: unless-stopped