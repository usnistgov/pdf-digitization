load_module /usr/local/nginx/modules/ngx_http_headers_more_filter_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        text/javascript  js mjs;
        text/css         css;
        application/wasm wasm;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout 300s;

    server_tokens off;
    more_clear_headers Server;

    # Rate limit for LLM endpoint — 20 req/min per IP, burst allows short spikes
    limit_req_zone $binary_remote_addr zone=llm:10m rate=20r/m;

    # PDFs can be large
    client_max_body_size 50m;

    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        # Security headers applied to all responses.
        # NOTE: do not add add_header in location blocks — child blocks
        # that define any add_header stop inheriting these.
        add_header 'Content-Security-Policy' "default-src https://*.nist.gov; script-src 'self' 'unsafe-eval' https://pages.nist.gov https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://pages.nist.gov; font-src 'self'; img-src 'self' data: https://pages.nist.gov; connect-src 'self' data: https://*.nist.gov; object-src 'none'; frame-ancestors 'none';" always;
        add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'Strict-Transport-Security' 'max-age=86400; includeSubDomains; preload' always;

        # LLM proxy — rate limited, long read timeout for slow model responses
        location /chat/completions {
            limit_req zone=llm burst=10 nodelay;

            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";
            proxy_hide_header  X-Powered-By;

            proxy_connect_timeout  5s;
            proxy_send_timeout     30s;
            proxy_read_timeout     300s;
        }

        # Health check — no rate limit, no access log noise
        location /health {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # Frontend SPA
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}